openapi: 3.1.0
info:
  title: AI Fishing Concierge API
  version: 0.1.0
  description: Custom GPT Actions backend for shore spinning forecasts and fishing reports in Israel's Mediterranean coast.
servers:
  - url: https://fishing-wgzo.onrender.com
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check backend health
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /spots:
    get:
      operationId: listFishingSpots
      summary: List available fishing spots
      responses:
        "200":
          description: Available spots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotsResponse"

  /forecast-context:
    get:
      operationId: getFishingForecastContext
      summary: Get factual context for an LLM-generated fishing forecast
      description: Use this as the primary forecast action. It returns facts, hourly API conditions, data quality, seasonal species notes, similar reports, and recent reports. The GPT must calculate bite scores, hourly chances, and probabilities itself.
      parameters:
        - name: spot
          in: query
          required: true
          schema:
            type: string
            enum: [Bat Yam, Jaffa]
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: start_time
          in: query
          required: false
          schema:
            type: string
            description: HH:MM
        - name: end_time
          in: query
          required: false
          schema:
            type: string
            description: HH:MM
        - name: target_species
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Context package for LLM forecast generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastContextResponse"

  /report:
    post:
      operationId: addFishingReport
      summary: Append a fishing report to Google Sheets
      description: Append-only operation. This action can create a new report row but cannot edit, overwrite, patch, or delete existing rows. Corrections must be appended as new reports with notes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportIn"
      responses:
        "200":
          description: Report appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportAppendResponse"

  /reports:
    get:
      operationId: listFishingReports
      summary: Read historical fishing reports
      parameters:
        - name: spot
          in: query
          required: false
          schema:
            type: string
            enum: [Bat Yam, Jaffa]
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: species
          in: query
          required: false
          schema:
            type: string
        - name: angler_name
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Report list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportOut"

  /similar-reports:
    get:
      operationId: findSimilarFishingReports
      summary: Find historical reports similar to current conditions
      parameters:
        - name: spot
          in: query
          required: true
          schema:
            type: string
            enum: [Bat Yam, Jaffa]
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: wind_direction
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 360
        - name: wave_height
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: sea_temperature
          in: query
          required: false
          schema:
            type: number
        - name: time_of_day
          in: query
          required: false
          schema:
            type: string
            enum: [dawn, day, dusk, night]
        - name: target_species
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: Similar reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimilarReport"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string

    SpotsResponse:
      type: object
      properties:
        spots:
          type: array
          items:
            $ref: "#/components/schemas/Spot"

    Spot:
      type: object
      properties:
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        fishing_type:
          type: string
        depth_m:
          type: string
        bottom:
          type: string
        geometry_notes:
          type: string
        good_for:
          type: array
          items:
            type: string
        safety_notes:
          type: array
          items:
            type: string

    Conditions:
      type: object
      properties:
        wind_speed:
          type: number
          nullable: true
        wind_direction:
          type: number
          nullable: true
        wind_gusts:
          type: number
          nullable: true
        air_temperature:
          type: number
          nullable: true
        pressure:
          type: number
          nullable: true
        pressure_trend:
          type: number
          nullable: true
        cloud_cover:
          type: number
          nullable: true
        rain:
          type: number
          nullable: true
        wave_height:
          type: number
          nullable: true
        wave_period:
          type: number
          nullable: true
        wave_direction:
          type: number
          nullable: true
        sea_temperature:
          type: number
          nullable: true
        tide_level:
          type: number
          nullable: true
        sunrise:
          type: string
          nullable: true
        sunset:
          type: string
          nullable: true
        moon_phase:
          type: string
          nullable: true
        moon_illumination:
          type: number
          nullable: true

    HourlyConditions:
      type: object
      properties:
        time:
          type: string
        time_of_day:
          type: string
          enum: [dawn, day, dusk, night]
        wind_speed:
          type: number
          nullable: true
        wind_direction:
          type: number
          nullable: true
        wind_gusts:
          type: number
          nullable: true
        air_temperature:
          type: number
          nullable: true
        pressure:
          type: number
          nullable: true
        cloud_cover:
          type: number
          nullable: true
        rain:
          type: number
          nullable: true
        wave_height:
          type: number
          nullable: true
        wave_period:
          type: number
          nullable: true
        wave_direction:
          type: number
          nullable: true
        sea_temperature:
          type: number
          nullable: true
        tide_level:
          type: number
          nullable: true

    SimilarReport:
      type: object
      properties:
        angler_name:
          type: string
          nullable: true
        date:
          type: string
          nullable: true
        spot:
          type: string
          nullable: true
        species:
          type: string
          nullable: true
        lure:
          type: string
          nullable: true
        summary:
          type: string
        similarity_score:
          type: integer
          minimum: 0
          maximum: 100

    SeasonalSpeciesNote:
      type: object
      properties:
        species:
          type: string
        active_months:
          type: array
          items:
            type: integer
        preferred_sea_temperature_c:
          type: array
          items:
            type: integer
        season_status:
          type: string
          enum: [favorable, near-season, off-season]
        recommended_lures:
          type: array
          items:
            type: string
        behavior_clues:
          type: array
          items:
            type: string

    DataQuality:
      type: object
      properties:
        weather_api_ok:
          type: boolean
        marine_api_ok:
          type: boolean
        historical_reports_ok:
          type: boolean
        historical_reports_count:
          type: integer
        similar_reports_count:
          type: integer
        missing_data:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string

    ForecastContextResponse:
      type: object
      properties:
        purpose:
          type: string
        llm_role:
          type: string
        spot:
          type: string
        date:
          type: string
        start_time:
          type: string
          nullable: true
        end_time:
          type: string
          nullable: true
        target_species:
          type: string
          nullable: true
        spot_profile:
          $ref: "#/components/schemas/Spot"
        conditions:
          $ref: "#/components/schemas/Conditions"
        hourly_conditions:
          type: array
          items:
            $ref: "#/components/schemas/HourlyConditions"
        api_raw_available:
          type: object
          properties:
            weather:
              type: boolean
            marine:
              type: boolean
            historical_reports:
              type: boolean
        data_quality:
          $ref: "#/components/schemas/DataQuality"
        seasonal_species_notes:
          type: array
          items:
            $ref: "#/components/schemas/SeasonalSpeciesNote"
        recent_reports:
          type: array
          items:
            $ref: "#/components/schemas/ReportOut"
        similar_reports:
          type: array
          items:
            $ref: "#/components/schemas/SimilarReport"
        warnings:
          type: array
          items:
            type: string
        llm_instructions:
          type: array
          items:
            type: string

    ReportIn:
      type: object
      additionalProperties: false
      required: [spot, date]
      properties:
        angler_name:
          type: string
        spot:
          type: string
          enum: [Bat Yam, Jaffa]
        date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
        species_caught:
          type: string
        fish_count:
          type: integer
          minimum: 0
        size_cm:
          type: number
          minimum: 0
        weight_kg:
          type: number
          minimum: 0
        lure_type:
          type: string
        lure_name:
          type: string
        lure_size_mm:
          type: number
          minimum: 0
        lure_weight_g:
          type: number
          minimum: 0
        lure_color:
          type: string
        retrieve_style:
          type: string
        water_clarity_score:
          type: integer
          minimum: 1
          maximum: 10
        baitfish_presence_score:
          type: integer
          minimum: 1
          maximum: 10
        bird_activity_score:
          type: integer
          minimum: 1
          maximum: 10
        hits_count:
          type: integer
          minimum: 0
        follows_count:
          type: integer
          minimum: 0
        lost_fish_count:
          type: integer
          minimum: 0
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    ReportOut:
      type: object
      properties:
        angler_name:
          type: string
          nullable: true
        spot:
          type: string
          nullable: true
        date:
          type: string
          nullable: true
        start_time:
          type: string
          nullable: true
        end_time:
          type: string
          nullable: true
        species_caught:
          type: string
          nullable: true
        fish_count:
          type: integer
          nullable: true
        size_cm:
          type: number
          nullable: true
        weight_kg:
          type: number
          nullable: true
        lure_type:
          type: string
          nullable: true
        lure_name:
          type: string
          nullable: true
        lure_size_mm:
          type: number
          nullable: true
        lure_weight_g:
          type: number
          nullable: true
        lure_color:
          type: string
          nullable: true
        retrieve_style:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    ReportAppendResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        updated_range:
          type: string
          nullable: true
        report:
          $ref: "#/components/schemas/ReportIn"
        conditions_snapshot:
          $ref: "#/components/schemas/Conditions"
